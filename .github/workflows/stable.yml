name: ExtYomi Stable

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'PepeTheCarton17/ExtYomi_Extension_Player'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/extyomi-stable.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/extyomi-stable.p12" >> "$GITHUB_ENV"

      - name: Build signed stable APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Generate checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > checksums.txt

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.0"
          TITLE="ExtYomi v0.1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" app/build/outputs/apk/release/*.apk app/build/outputs/apk/release/checksums.txt --clobber
          else
            gh release create "$TAG" app/build/outputs/apk/release/*.apk app/build/outputs/apk/release/checksums.txt \
              --title "$TITLE" --generate-notes
          fi
